<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HybridBrain 登录</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">
<div class="w-full max-w-md p-8 bg-slate-800 rounded-lg shadow-xl">
  <h1 class="text-2xl font-bold mb-2">HybridBrain</h1>
  <p class="text-slate-400 mb-6 text-sm">管理后台</p>
  <p id="setupHint" class="hidden text-yellow-400 text-xs mb-3">
    首次使用？请访问 <a href="/admin/setup" class="underline">/admin/setup</a>
  </p>
  <form id="loginForm" class="space-y-4">
    <input type="password" name="password" placeholder="密码"
           class="w-full px-4 py-2 bg-slate-700 rounded border border-slate-600 focus:border-blue-500 focus:outline-none">
    <button type="submit"
            class="w-full py-2 bg-blue-600 hover:bg-blue-700 rounded font-medium">
      登录
    </button>
    <div id="err" class="text-red-400 text-sm hidden"></div>
  </form>
</div>
<script>
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const pwd = e.target.password.value;
  const fd = new FormData();
  fd.append('password', pwd);
  const r = await fetch('/admin/login', {method:'POST', body:fd});
  if (r.ok) location.href = '/admin/dashboard';
  else {
    const err = document.getElementById('err');
    err.textContent = '密码错误';
    err.classList.remove('hidden');
  }
};

// 检测是否初始化
fetch('/admin/', {redirect:'manual'}).then(r => {
  // 若被重定向到 /setup，提示
  if (r.type === 'opaqueredirect' || r.status === 0) {
    // 无法读取 Location，用另一接口
  }
});
</script>
</body>
</html>
