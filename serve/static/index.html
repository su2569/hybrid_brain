<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>HybridBrain</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e5e5ea;
    padding: 12px 20px;
    font-weight: 600;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .status {
    font-size: 12px;
    color: #888;
    font-weight: normal;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  .msg {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
  }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.6;
    max-width: 85%;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble { background: #007aff; color: #fff; }
  .msg.bot .bubble { background: #fff; border: 1px solid #e5e5ea; }
  .msg .meta {
    font-size: 11px;
    color: #999;
    margin-top: 4px;
    padding: 0 6px;
  }
  .msg .sources {
    font-size: 12px;
    color: #666;
    margin-top: 6px;
    padding: 8px 10px;
    background: #fafafa;
    border-left: 3px solid #ddd;
    border-radius: 4px;
    max-width: 85%;
  }
  .msg .sources details { cursor: pointer; }
  .msg .sources summary { color: #999; user-select: none; }
  .msg .sources .doc {
    margin-top: 6px;
    padding: 6px 8px;
    background: #fff;
    border-radius: 4px;
    font-size: 12px;
    line-height: 1.5;
  }
  footer {
    border-top: 1px solid #e5e5ea;
    background: #fff;
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  #input {
    flex: 1;
    border: 1px solid #d1d1d6;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    resize: none;
    font-family: inherit;
    max-height: 120px;
  }
  #input:focus { outline: none; border-color: #007aff; }
  #send {
    background: #007aff;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  #send:disabled { background: #b0b0b0; cursor: not-allowed; }
  .thinking { color: #999; font-size: 12px; font-style: italic; }
</style>
</head>
<body>
<header>
  HybridBrain
  <span class="status" id="status">加载中...</span>
</header>
<div id="chat"></div>
<footer>
  <textarea id="input" rows="1" placeholder="输入消息..."></textarea>
  <button id="send">发送</button>
</footer>
<script>
let conversation = [];   // {role, content}
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
const statusEl = document.getElementById('status');

// 检查健康状态
fetch('/health').then(r => r.json()).then(d => {
  statusEl.textContent = `KB: ${d.kb_size} 条`;
}).catch(() => statusEl.textContent = '离线');

function addMsg(role, text, meta, sources) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    div.appendChild(m);
  }
  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'sources';
    const details = document.createElement('details');
    details.innerHTML = `<summary>查看 ${sources.length} 条来源</summary>`;
    sources.forEach((src, i) => {
      const d = document.createElement('div');
      d.className = 'doc';
      d.textContent = `[${i+1}] (${src.score.toFixed(3)}) ${src.passage}`;
      details.appendChild(d);
    });
    s.appendChild(details);
    div.appendChild(s);
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function send() {
  const q = inputEl.value.trim();
  if (!q) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  addMsg('user', q);
  conversation.push({ role: 'user', content: q });
  sendEl.disabled = true;

  const thinking = document.createElement('div');
  thinking.className = 'msg bot';
  thinking.innerHTML = '<div class="bubble thinking">思考中...</div>';
  chatEl.appendChild(thinking);
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const historyToSend = conversation.slice(0, -1);
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q, history: historyToSend }),
    });
    const d = await r.json();
    thinking.remove();
    addMsg('bot', d.answer,
           `${d.intent} (${d.intent_conf.toFixed(2)})`,
           d.sources);
    conversation.push({ role: 'assistant', content: d.answer });
  } catch (e) {
    thinking.remove();
    addMsg('bot', '抱歉，出错了：' + e.message);
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

sendEl.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
inputEl.focus();
</script>
</body>
</html>
